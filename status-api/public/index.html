<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attic Status Card</title>
<style>
  :root {
    --bg: #0b0f16;
    --text: #f1f3f4;
    --muted: rgba(241, 243, 244, .62);
    --faint: rgba(241, 243, 244, .38);
    --card: rgba(18, 22, 31, .58);
    --card-line: rgba(255, 255, 255, .09);
    --working: #7ee2a8;
    --waiting: #ffb454;
    --ready: #8ab4f8;
    --idle: #9aa0a6;
    --away: #5f6368;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Google Sans", Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: grid; place-items: center; padding: 16px; }

  /* 16:9 frame that scales a 1920x1080 layout via --u (1u = 1px at 1080p) */
  .tv { --u: min(calc((100vw - 32px) / 1920), calc((100vh - 32px) / 1080));
    width: calc(1920 * var(--u)); height: calc(1080 * var(--u)); position: relative; overflow: hidden;
    border-radius: calc(14 * var(--u)); box-shadow: 0 20px 60px rgba(0,0,0,.5);
    background:
      radial-gradient(ellipse 40% 12% at 72% 37%, rgba(214,140,96,.35), transparent 70%),
      linear-gradient(180deg, #2b3140 0%, #4a4350 26%, #3a3540 33%, #1e2230 38%, #141925 52%, #0c1018 100%); }
  .hills { position: absolute; inset: 0; background:
      radial-gradient(ellipse 30% 9% at 15% 30%, #3b3a46 60%, transparent 61%),
      radial-gradient(ellipse 38% 8% at 55% 31%, #403c48 60%, transparent 61%),
      radial-gradient(ellipse 30% 9% at 90% 30%, #3b3a46 60%, transparent 61%); opacity: .8; }
  .top { position: absolute; top: calc(58 * var(--u)); left: calc(96 * var(--u)); right: calc(96 * var(--u));
    display: flex; justify-content: space-between; align-items: center; font-size: calc(32 * var(--u)); color: #e8eaed; }
  .gear { width: calc(38 * var(--u)); height: calc(38 * var(--u)); border: calc(4 * var(--u)) solid #e8eaed; border-radius: 50%; }
  .tiles { position: absolute; top: calc(476 * var(--u)); left: calc(280 * var(--u)); display: flex; gap: calc(80 * var(--u)); }
  .tile { width: calc(160 * var(--u)); text-align: center; font-size: calc(24 * var(--u)); color: #dadce0; }
  .tile i { display: block; height: calc(144 * var(--u)); border-radius: calc(14 * var(--u)); margin-bottom: calc(26 * var(--u));
    background: rgba(255,255,255,.08); }

  /* ---- the status card (this is what the launcher draws natively) ---- */
  .card { position: absolute; left: calc(270 * var(--u)); width: calc(1380 * var(--u)); top: calc(770 * var(--u));
    min-height: calc(196 * var(--u)); padding: calc(30 * var(--u)) calc(40 * var(--u));
    background: var(--card); border: 1px solid var(--card-line); border-radius: calc(22 * var(--u));
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    display: grid; grid-template-columns: 1fr auto; gap: calc(40 * var(--u)); align-items: center;
    transition: opacity .6s; }
  .card[data-state="away"], .card[data-state="offline"] { opacity: .55; }
  .pill { display: inline-flex; align-items: center; gap: calc(12 * var(--u)); font-size: calc(19 * var(--u));
    letter-spacing: .14em; font-weight: 600; color: var(--c); text-transform: uppercase; }
  .dot { width: calc(14 * var(--u)); height: calc(14 * var(--u)); border-radius: 50%; background: var(--c);
    box-shadow: 0 0 calc(14 * var(--u)) var(--c); }
  .card[data-state="working"] .dot { animation: pulse 1.6s ease-in-out infinite; }
  .card[data-state="waiting"] .dot { animation: pulse .8s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; transform: scale(.8); } }
  .headline { font-size: calc(40 * var(--u)); font-weight: 500; margin: calc(10 * var(--u)) 0 calc(6 * var(--u)); }
  .activity { font-size: calc(27 * var(--u)); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { font-size: calc(21 * var(--u)); color: var(--faint); margin-top: calc(10 * var(--u)); }
  .others { display: flex; gap: calc(12 * var(--u)); margin-top: calc(14 * var(--u)); flex-wrap: wrap; }
  .chip { font-size: calc(19 * var(--u)); color: var(--muted); padding: calc(6 * var(--u)) calc(14 * var(--u));
    border-radius: 999px; background: rgba(255,255,255,.06); display: inline-flex; gap: calc(8 * var(--u)); align-items: center; }
  .chip .dot { width: calc(9 * var(--u)); height: calc(9 * var(--u)); box-shadow: none; animation: none; }
  .stats { display: flex; gap: calc(44 * var(--u)); padding-left: calc(40 * var(--u)); border-left: 1px solid var(--card-line); }
  .stat b { display: block; font-size: calc(40 * var(--u)); font-weight: 500; font-variant-numeric: tabular-nums; }
  .stat span { font-size: calc(19 * var(--u)); color: var(--faint); letter-spacing: .06em; text-transform: uppercase; }

  .bar { position: fixed; top: 10px; right: 16px; font-size: 13px; color: var(--faint); }
  .bar button { background: none; border: 1px solid var(--card-line); color: var(--muted); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
</style>
</head>
<body>
<div class="bar"><span id="conn">connecting…</span> <button id="setkey" type="button">Set key</button></div>
<div class="tv">
  <div class="hills"></div>
  <div class="top"><div class="gear"></div><div>◠ <span id="clock"></span></div></div>
  <div class="tiles">
    <div class="tile"><i></i>YouTube</div><div class="tile"><i></i>Netflix</div><div class="tile"><i></i>beIN Sports</div>
    <div class="tile"><i></i>Kodi</div><div class="tile"><i></i>Disney+</div><div class="tile"><i></i>Apps</div>
  </div>

  <section class="card" id="card" data-state="offline" aria-live="polite">
    <div>
      <div class="pill" id="pill"><span class="dot"></span><span id="label">Offline</span></div>
      <div class="headline" id="headline">No active sessions</div>
      <div class="activity" id="activity">Waiting for Claude Code activity</div>
      <div class="meta" id="meta"></div>
      <div class="others" id="others"></div>
    </div>
    <div class="stats">
      <div class="stat"><b id="sActive">0m</b><span>Active today</span></div>
      <div class="stat"><b id="sPrompts">0</b><span>Prompts</span></div>
      <div class="stat"><b id="sEdits">0</b><span>Edits</span></div>
    </div>
  </section>
</div>
<script>
  const LABEL = { working: "Working", waiting: "Needs you", ready: "Ready", idle: "Open", away: "Away", offline: "Offline" };
  const $ = (id) => document.getElementById(id);
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
                  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  let key = new URLSearchParams(location.search).get("key") || store.get("attic-key") || "";
  $("setkey").onclick = () => { const k = prompt("READ_TOKEN", key); if (k !== null) { key = k.trim(); store.set("attic-key", key); poll(); } };

  const dur = (ms) => { const m = Math.max(0, Math.round(ms / 60000)); return m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`; };
  const ago = (ms) => ms < 60000 ? "just now" : `${dur(ms)} ago`;
  const color = (s) => `var(--${s === "offline" ? "away" : s})`;

  function render(d) {
    const card = $("card"), top = d.sessions[0];
    card.dataset.state = d.state;
    card.style.setProperty("--c", color(d.state));
    $("label").textContent = LABEL[d.state] || d.state;
    $("headline").textContent = d.headline;
    $("activity").textContent = top ? top.activity : (d.lastActivityAt ? `Last activity ${ago(d.serverTime - d.lastActivityAt)}` : "Waiting for Claude Code activity");
    $("meta").textContent = top ? [top.host, `session ${dur(top.lastAt - top.startedAt)}`, `${top.prompts} prompt${top.prompts === 1 ? "" : "s"}`, top.model].filter(Boolean).join("  ·  ") : "";
    $("others").replaceChildren(...d.sessions.slice(1, 4).map((s) => {
      const el = document.createElement("span"); el.className = "chip"; el.style.setProperty("--c", color(s.state));
      el.innerHTML = '<span class="dot"></span>'; el.append(`${s.project} — ${s.activity}`); return el;
    }));
    $("sActive").textContent = dur(d.today.activeMinutes * 60000);
    $("sPrompts").textContent = d.today.prompts;
    $("sEdits").textContent = d.today.edits;
  }

  async function poll() {
    if (!key) { $("conn").textContent = "no key set"; return; }
    try {
      const r = await fetch(`api/status`, { headers: { Authorization: `Bearer ${key}` }, cache: "no-store" });
      if (!r.ok) throw new Error(r.status === 401 ? "bad key" : `HTTP ${r.status}`);
      render(await r.json());
      $("conn").textContent = `updated ${new Date().toLocaleTimeString()}`;
    } catch (e) { $("conn").textContent = `error: ${e.message}`; }
  }
  const tick = () => { $("clock").textContent = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); };
  tick(); setInterval(tick, 10000);
  poll(); setInterval(poll, 15000);
</script>
</body>
</html>
